<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>if (!location.pathname.endsWith("login.html")) { document.documentElement.style.visibility = "hidden"; }</script>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c10">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | الصح من الغلط</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .acc-wrap{ max-width:560px; margin:0 auto; padding:60px 20px; }
  .acc-card{
    background:var(--glass-bg); border:1px solid var(--glass-border);
    border-radius:18px; padding:32px; text-align:center;
  }
  .acc-points{ font-size:3rem; font-weight:800; color:var(--accent-gold); margin:10px 0; }
  .acc-label{ color:var(--text-muted); font-size:.9rem; }
  .acc-name{ font-size:1.3rem; font-weight:700; margin-top:16px; }
  .acc-history{ margin-top:30px; text-align:right; }
  .acc-history h3{ font-size:1rem; margin-bottom:12px; color:var(--text-muted); }
  .acc-row{
    display:flex; justify-content:space-between; padding:10px 14px;
    border-bottom:1px solid var(--glass-border); font-size:.9rem;
  }
  .acc-row:last-child{ border-bottom:none; }
  .rewards-section{ margin-top:30px; text-align:right; }
  .rewards-section h3{ font-size:1rem; margin-bottom:14px; color:var(--text-muted); }
  .reward-card{
    border:1px solid var(--glass-border); border-radius:14px; padding:16px;
    margin-bottom:14px; background:rgba(255,255,255,.02);
  }
  .reward-card.unlocked{ border-color:var(--accent-gold); }
  .reward-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .reward-name{ font-weight:700; font-size:.92rem; }
  .reward-badge{ font-size:.75rem; padding:3px 10px; border-radius:20px; }
  .reward-badge.locked{ background:rgba(255,255,255,.06); color:var(--text-muted); }
  .reward-badge.unlocked{ background:rgba(212,175,55,.15); color:var(--accent-gold); }
  .reward-bar-track{ height:8px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden; }
  .reward-bar-fill{ height:100%; background:var(--accent-gold); border-radius:6px; transition:width .4s ease; }
  .reward-progress-text{ font-size:.78rem; color:var(--text-muted); margin-top:6px; }
  .signout-btn{
    margin-top:26px; padding:10px 22px; border-radius:10px; border:1px solid var(--glass-border);
    background:transparent; color:var(--text-muted); font-family:var(--font-arabic); cursor:pointer;
  }
  .signout-btn:hover{ border-color:#ff6b6b; color:#ff6b6b; }
</style>
</head>
<body class="profile-page-body">

<nav class="navbar" id="navbar">
  <div class="navbar-container" style="justify-content:space-between; display:flex; align-items:center; width:100%;">
    <a href="index.html" class="navbar-logo">الصح <span class="accent-gold">من</span> الغلط</a>
    <a href="index.html" style="font-family:var(--font-arabic); font-size:.85rem; color:var(--text-muted); border:1px solid var(--glass-border); padding:8px 16px; border-radius:20px; text-decoration:none;">← الرئيسية</a>
  </div>
</nav>

<div class="acc-wrap">
  <div class="acc-card" id="accCard">
    <div class="acc-label">جاري التحميل...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
/*
  إعدادات الجوايز — مؤقتة لحد ما يتظبط شراكة فعلية لتوفير هدية حقيقية.
  العتبة دلوقتي عالية عمدًا (عمليًا صعب توصلها) عشان محدش ياخد وعد بهدية
  لسه مش موجودة. لما الشراكة تتظبط، غيّر REWARD_TIER_1 للرقم الحقيقي
  وهدية المستوى التاني هتتحسب تلقائيًا كضعف الرقم.
*/
const REWARD_TIER_1 = 6000;
const REWARD_TIER_2 = REWARD_TIER_1 * 2;

function renderRewards(points) {
  const tiers = [
    { name: 'الجائزة الأولى', threshold: REWARD_TIER_1 },
    { name: 'الجائزة الكبرى', threshold: REWARD_TIER_2 }
  ];

  return tiers.map(t => {
    const unlocked = points >= t.threshold;
    const pct = Math.min(100, Math.round((points / t.threshold) * 100));
    return `
      <div class="reward-card ${unlocked ? 'unlocked' : ''}">
        <div class="reward-top">
          <span class="reward-name">🎁 ${t.name}</span>
          <span class="reward-badge ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? 'اتفتحت' : `${t.threshold} نقطة`}</span>
        </div>
        <div class="reward-bar-track"><div class="reward-bar-fill" style="width:${pct}%;"></div></div>
        <div class="reward-progress-text">${unlocked ? 'مبروك! تواصل معانا عشان تستلم جايزتك' : `${points} / ${t.threshold} نقطة`}</div>
      </div>
    `;
  }).join('');
}

async function loadAccount() {
  const user = await getCurrentUser();
  const card = document.getElementById('accCard');

  if (!user) {
    card.innerHTML = `
      <div class="acc-label">لازم تسجل دخول الأول</div>
      <a href="login.html" style="color:var(--accent-gold); font-weight:700;">تسجيل الدخول ←</a>
    `;
    return;
  }

  const profile = await getProfile();

  const { data: history } = await supabaseClient
    .from('game_completions')
    .select('game_id, points_earned, created_at')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });

  let historyHtml = '<div class="acc-label">لسه معملتش أي لعبة</div>';
  if (history && history.length) {
    historyHtml = history.map(h => `
      <div class="acc-row">
        <span>${h.game_id}</span>
        <span style="color:var(--accent-gold);">+${h.points_earned}</span>
      </div>
    `).join('');
  }

  card.innerHTML = `
    <div class="acc-label">إجمالي النقط</div>
    <div class="acc-points">${profile?.points ?? 0}</div>
    <div class="acc-name">${profile?.name || user.email}</div>
    <button class="signout-btn" id="signoutBtn">تسجيل الخروج</button>
    <div class="rewards-section">
      <h3>الجوايز</h3>
      ${renderRewards(profile?.points ?? 0)}
    </div>
    <div class="acc-history">
      <h3>سجل الألعاب</h3>
      ${historyHtml}
    </div>
  `;
  document.getElementById('signoutBtn').addEventListener('click', signOutUser);
}

loadAccount();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(console.error);
  });
}
</script>
<script src="pwa-install.js"></script>
</body>
</html>
