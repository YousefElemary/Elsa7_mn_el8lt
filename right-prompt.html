<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>if (!location.pathname.endsWith("login.html")) { document.documentElement.style.visibility = "hidden"; }</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البرومبت الصح | الصح من الغلط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10; --panel:#12151b; --line:#242832;
    --ink:#eef1f6; --dim:#8b93a3;
    --signal:#31d0aa; --noise:#ff3b5c; --scan:#00d4ff; --warn:#ffb020;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; min-height:100vh; position:relative;}
  body::before{content:""; position:fixed; inset:0; background:repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px); pointer-events:none; z-index:1;}
  .app{position:relative; z-index:2; max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:28px 20px 40px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
  .back{font-family:monospace; font-size:12px; color:var(--dim); text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:20px;}
  .mark{font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;}
  .mark span{color:var(--scan);}

  .round-tag{font-family:monospace; font-size:11px; color:var(--dim); letter-spacing:2px; margin-bottom:10px; display:block;}
  .goal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-bottom:22px;
  }
  .goal-eyebrow{font-family:monospace; font-size:11px; color:var(--scan); letter-spacing:2px; display:block; margin-bottom:10px;}
  .goal-text{font-family:'Cairo',sans-serif; font-weight:700; font-size:18px; line-height:1.6;}

  .instr{color:var(--dim); font-size:13px; margin-bottom:14px;}

  .prompts{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
  .prompt-opt{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; cursor:pointer; transition:border-color .15s, background .15s;
    font-size:14.5px; line-height:1.8;
  }
  .prompt-opt:hover{border-color:var(--scan);}
  .prompt-opt.best{border-color:var(--signal); background:rgba(49,208,170,0.1);}
  .prompt-opt.risky{border-color:var(--noise); background:rgba(255,59,92,0.08);}
  .prompt-opt.picked-wrong{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  .tag-row{display:flex; gap:6px; margin-top:10px;}
  .tag{font-family:monospace; font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--dim);}
  .tag.good{color:var(--signal); border-color:var(--signal);}
  .tag.bad{color:var(--noise); border-color:var(--noise);}

  .feedback{
    padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.85; display:none; margin-bottom:16px;
  }
  .feedback.show{display:block;}
  .feedback.correct{background:rgba(49,208,170,0.08); border:1px solid var(--signal); color:var(--signal);}
  .feedback.wrong{background:rgba(255,59,92,0.08); border:1px solid var(--noise); color:var(--noise);}

  .btn{padding:14px; border-radius:12px; font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; cursor:pointer; border:none; width:100%; display:none;}
  .btn.show{display:block;}
  .btn-primary{background:var(--scan); color:#04121a;}

  footer{margin-top:auto; padding-top:30px; text-align:center; color:var(--dim); font-size:12px; font-family:monospace;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="lobby.html">← اللوبي</a>
    <div class="mark">البرومبت <span>الصح</span></div>
  </div>

  <span class="round-tag" id="roundTag"></span>

  <div class="goal-box">
    <span class="goal-eyebrow">الهدف</span>
    <div class="goal-text" id="goalText"></div>
  </div>

  <p class="instr">اختار البرومبت اللي بيوصلك للهدف بطريقة صح ومسؤولة:</p>

  <div class="prompts" id="promptsList"></div>

  <div class="feedback" id="feedbackBox"></div>
  <button class="btn btn-primary" id="nextBtn">الجولة التالية</button>

  <footer>البرومبت الصح — الصح من الغلط</footer>
</div>

<script>
/* =====================================================================
   الجولات — عدّل هنا بس
   كل جولة: هدف، ومصفوفة برومبتات، كل برومبت له:
   text, isBest (true لواحد بس), tag ("مساعدة" أو "بديل كامل" أو غيرها),
   note (شرح ليه صح أو غلط)
===================================================================== */
const ROUNDS = [
  {
    goal: "عايز أعمل بحث لمشروع تخرجي عن التغير المناخي",
    prompts: [
      {
        text: "اكتبلي البحث كامل بالمراجع من الأول للآخر عشان أسلّمه زي ما هو.",
        isBest: false,
        tag: "بديل كامل",
        note: "البرومبت ده بيخلي الـ AI يعمل الشغل كله بدلك، وده مش تعلّم ولا مجهود منك — استخدام غلط."
      },
      {
        text: "لخصلي أهم ٥ نقط عن أسباب التغير المناخي من مصادر علمية موثوقة عشان أبني عليهم بحثي بنفسي.",
        isBest: true,
        tag: "مساعدة",
        note: "البرومبت ده بيستخدم الـ AI كأداة تلخيص ومساعدة، والكتابة والتحليل النهائي بيفضلوا شغلك أنت."
      },
      {
        text: "اكتبلي مقدمة وخاتمة قوية للبحث بأسلوب أكاديمي.",
        isBest: false,
        tag: "بديل جزئي",
        note: "أفضل من الأول، بس لسه بيخلي جزء أساسي من الكتابة يبقى شغل الـ AI مش شغلك."
      }
    ]
  },
  {
    goal: "عايز أرد على إيميل شكوى من عميل غاضب في شغلي",
    prompts: [
      {
        text: "اكتب رد رسمي ومهذب على الشكوى دي، وأنا هراجعه وأعدّل فيه قبل ما أبعته.",
        isBest: true,
        tag: "مساعدة",
        note: "استخدام الـ AI كمسودة أولى مع مراجعة بشرية قبل الإرسال ده استخدام مسؤول وصح."
      },
      {
        text: "رد على العميل ده كأنك أنا وابعته على طول من غير ما أشوفه.",
        isBest: false,
        tag: "بديل كامل",
        note: "إرسال رد تلقائي بدون مراجعة بشرية في موقف حساس زي شكوى عميل، ده مخاطرة كبيرة ومسؤولية بتتحط على الـ AI بدل الشخص."
      },
      {
        text: "اكتب رد يقنع العميل إن الشكوى غلط حتى لو كانت صح، وخليه يبان مقتنع.",
        isBest: false,
        tag: "استخدام مضلل",
        note: "استخدام الـ AI عشان تتلاعب بشخص أو تنكر حق واضح ده استخدام غير أخلاقي بغض النظر عن الصياغة."
      }
    ]
  },
  {
    goal: "عايز أفكار بوستات لبراند نوت بوك يستهدف الشباب والطلاب الجامعيين",
    prompts: [
      {
        text: "اعمل بوستات.",
        isBest: false,
        tag: "برومبت ناقص",
        note: "من غير تحديد الدور، الجمهور، ولا الأسلوب المطلوب، الأداة هتطلع رد عام مالوش علاقة حقيقية بهدفك."
      },
      {
        text: "تصرّف كخبير تسويق على السوشيال ميديا، وقدّملي أفكار بوستات لبراند نوت بوك يستهدف الشباب والطلاب الجامعيين، بأسلوب شبابي وجذاب.",
        isBest: true,
        tag: "برومبت كامل",
        note: "البرومبت ده بيحدد الدور (خبير تسويق)، المهمة بدقة (أفكار بوستات)، الجمهور (طلاب جامعيين)، والأسلوب (شبابي وجذاب) — ده بالظبط المربع الذهبي لهندسة الأوامر."
      },
      {
        text: "اكتب أي حاجة عن النوت بوك تخلي الناس تشتري.",
        isBest: false,
        tag: "برومبت مبهم",
        note: "الصياغة غامضة ومركّزة على 'الإقناع بالشراء' بشكل عام أكتر من تحديد جمهور وأسلوب واضح، فالنتيجة هتكون عشوائية."
      }
    ]
  },
  {
    goal: "عايز أحضّر لمقابلة شخصية لوظيفة أول مرة أتقدملها",
    prompts: [
      {
        text: "اسألني أسئلة مقابلة شخصية شائعة لوظيفة [اسم الوظيفة]، وقيّم إجاباتي واديني ملاحظات لتحسينها.",
        isBest: true,
        tag: "تدريب تفاعلي",
        note: "البرومبت ده بيحول الأداة لمدرب تفاعلي بيديك ملاحظات حقيقية تساعدك تتحسن، مش بس بيديك إجابات جاهزة تحفظها."
      },
      {
        text: "اكتبلي إجابات جاهزة لأسئلة المقابلة الشخصية عشان أحفظها كلمة كلمة.",
        isBest: false,
        tag: "حفظ ببغائي",
        note: "حفظ إجابات جاهزة بيخليك تبان مصطنع وغير واثق لما تتسأل سؤال مختلف شوية عن اللي حفظته — التدريب على الفهم أفضل من الحفظ."
      },
      {
        text: "قولي إيه أكتر حاجة يكرهها أصحاب الشركات في المتقدمين عشان أعمل عكسها بالظبط.",
        isBest: false,
        tag: "برومبت سطحي",
        note: "التركيز على 'تجنب الكراهية' بدل بناء إجابات حقيقية بيدي نتيجة سطحية ومش مبنية على فهمك الفعلي لنقاط قوتك."
      }
    ]
  },
  {
    goal: "عايز أفهم موضوع علمي معقد قبل امتحان",
    prompts: [
      {
        text: "اشرحلي [الموضوع] بطريقة مبسطة بأمثلة من الحياة اليومية، وابدأ معايا بأساسيات الموضوع الأول.",
        isBest: true,
        tag: "برومبت تعليمي",
        note: "البرومبت ده بيطلب شرح مبني على أساسيات وأمثلة، وده بيبني فهم حقيقي للموضوع مش مجرد معلومات متفرقة."
      },
      {
        text: "لخصلي الموضوع كله في ٥ سطور عشان أذاكره بسرعة قبل الامتحان بساعة.",
        isBest: false,
        tag: "اختصار مفرط",
        note: "التلخيص المفرط لموضوع معقد بيفقد التفاصيل اللي ممكن تكون أساسية للفهم، وده حل سريع بس سطحي مش هيفيدك في فهم حقيقي."
      },
      {
        text: "حلّلي كل أسئلة الامتحان المحتملة وجاوب عليها عشان أنسخها زي ما هي.",
        isBest: false,
        tag: "بديل كامل",
        note: "ده مش مذاكرة، ده اعتماد كلي على تخمين الأداة لأسئلة الامتحان بدل فهم المادة فعليًا — مخاطرة كبيرة ومالوش علاقة بالتعلم."
      }
    ]
  }
];

let idx = 0;
let answered = false;
let correctCount = 0;
const el = id => document.getElementById(id);

function render(){
  answered = false;
  const r = ROUNDS[idx];
  el('roundTag').textContent = `ROUND_${String(idx+1).padStart(2,'0')} / ${ROUNDS.length}`;
  el('goalText').textContent = r.goal;

  const wrap = el('promptsList');
  wrap.innerHTML = '';
  r.prompts.forEach((p) => {
    const div = document.createElement('div');
    div.className = 'prompt-opt';
    div.innerHTML = `
      <div>${p.text}</div>
      <div class="tag-row"><span class="tag ${p.isBest ? 'good' : ''}">${p.tag}</span></div>
    `;
    div.addEventListener('click', () => choose(p, div));
    wrap.appendChild(div);
  });

  const fb = el('feedbackBox');
  fb.className = 'feedback';
  fb.textContent = '';
  el('nextBtn').classList.remove('show');
}

function choose(p, div){
  if(answered) return;
  answered = true;

  document.querySelectorAll('.prompt-opt').forEach(d => d.style.pointerEvents = 'none');

  if(p.isBest){
    div.classList.add('best');
    correctCount++;
  } else {
    div.classList.add('risky','picked-wrong');
  }

  // highlight the actual best option regardless
  const r = ROUNDS[idx];
  const allDivs = document.querySelectorAll('.prompt-opt');
  r.prompts.forEach((pp, i) => {
    if(pp.isBest) allDivs[i].classList.add('best');
  });

  const fb = el('feedbackBox');
  fb.classList.add('show', p.isBest ? 'correct' : 'wrong');
  fb.textContent = p.note;

  el('nextBtn').classList.add('show');
}

el('nextBtn').addEventListener('click', async () => {
  if(idx < ROUNDS.length - 1){ idx++; render(); }
  else {
    if (typeof awardGamePoints === 'function') {
      await awardGamePoints('right-prompt', correctCount * 5);
    }
    window.location.href = 'lobby.html';
  }
});

render();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body>
</html>
