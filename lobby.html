<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصح من الغلط | لوبي الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --panel-hi:#161a22;
    --line:#242832;
    --ink:#eef1f6;
    --dim:#8b93a3;
    --signal:#31d0aa;
    --noise:#ff3b5c;
    --scan:#00d4ff;
    --warn:#ffb020;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:1;
  }
  .wrap{
    position:relative; z-index:2;
    max-width:960px; margin:0 auto;
    padding:32px 20px 60px;
  }

  /* header */
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .mark{font-family:'Cairo',sans-serif; font-weight:800; font-size:20px;}
  .mark span{color:var(--scan);}
  .badge{
    font-size:11px; color:var(--dim); border:1px solid var(--line);
    padding:4px 10px; border-radius:20px; font-family:monospace; letter-spacing:1px;
  }
  .hero-title{
    font-family:'Cairo',sans-serif; font-weight:800;
    font-size:clamp(28px,6vw,42px);
    line-height:1.3; margin:26px 0 10px;
  }
  .hero-title span{color:var(--scan);}
  .hero-sub{
    color:var(--dim); font-size:15px; line-height:1.9;
    max-width:58ch; margin-bottom:38px;
  }

  /* grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    position:relative;
    overflow:hidden;
    display:flex; flex-direction:column;
    min-height:190px;
    transition:border-color .15s, transform .15s;
  }
  .card.live{cursor:pointer;}
  .card.live:hover{border-color:var(--scan); transform:translateY(-3px);}
  .card.soon{opacity:.55;}

  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:14px;
  }
  .card-index{
    font-family:monospace; font-size:11px; color:var(--dim); letter-spacing:1px;
  }
  .status{
    font-family:monospace; font-size:10px; letter-spacing:1px;
    padding:3px 9px; border-radius:20px;
  }
  .status.live{color:var(--signal); border:1px solid var(--signal); background:rgba(49,208,170,0.08);}
  .status.soon{color:var(--warn); border:1px solid var(--warn); background:rgba(255,176,32,0.08);}

  .card-name{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:19px;
    margin-bottom:8px;
  }
  .card-desc{
    color:var(--dim); font-size:13.5px; line-height:1.8; flex:1;
  }
  .card-cta{
    margin-top:16px; font-family:monospace; font-size:12px;
    color:var(--scan); display:flex; align-items:center; gap:6px;
  }
  .card.soon .card-cta{color:var(--dim);}

  /* signature: circuit trace connecting cards */
  .circuit{
    display:flex; align-items:center; justify-content:center;
    margin:34px 0; gap:6px; opacity:.5;
  }
  .circuit .dot{width:5px; height:5px; border-radius:50%; background:var(--scan);}
  .circuit .ln{flex:1; height:1px; background:var(--line); max-width:70px;}

  footer{
    margin-top:50px; text-align:center; color:var(--dim);
    font-size:12px; font-family:monospace;
  }

  /* suggestion note */
  .suggest-note{
    margin-top:44px;
    border:1px dashed var(--line);
    border-radius:14px;
    padding:18px 20px;
    color:var(--dim);
    font-size:13.5px;
    line-height:1.9;
  }
  .suggest-note b{color:var(--ink); font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mark">الصح <span>من</span> الغلط</div>
    <div class="badge">GAME LOBBY</div>
  </div>

  <h1 class="hero-title">مش لعبة واحدة.<br>كل لعبة <span>زاوية مختلفة</span> لنفس الفكرة.</h1>
  <p class="hero-sub">اختار طريقة اللعب اللي تناسبك — كل واحدة بتتحداك بطريقة مختلفة تفهم إزاي تستخدم الذكاء الاصطناعي صح.</p>

  <div class="grid" id="gameGrid"></div>

  <footer>الصح من الغلط — التعامل الصح مع الذكاء الاصطناعي</footer>
</div>

<script>
/* =====================================================================
   الألعاب — عدّل هنا بس لإضافة/تعديل لعبة
   status: "live" (جاهزة وبتتربط بصفحتها) أو "soon" (لسه ما اتبنتش)
   url: يتحط لما اللعبة تتبني كصفحة منفصلة
===================================================================== */
const GAMES = [
  {
    name: "الكويز بالمراحل",
    desc: "أسئلة قصيرة عن الاستخدام الصح للذكاء الاصطناعي، بمراحل مختلفة حسب فئتك العمرية.",
    status: "live",
    url: "quiz-game.html"
  },
  {
    name: "غرفة التحقيق",
    desc: "موقف مشبوه مرتبط بالـ AI، وعليك تفتح أدلة واحدة واحدة وتقرر: استخدام صح ولا غلط؟",
    status: "live",
    url: "investigation-room.html"
  },
  {
    name: "البرومبت الصح",
    desc: "هدف واحد، كذا برومبت مختلف. اختار الأدق والأكثر أخلاقية للوصول للهدف صح.",
    status: "live",
    url: "right-prompt.html"
  },
  {
    name: "خط الزمن",
    desc: "سيناريو بيتفتح خطوة خطوة، وكل قرار تاخده بيغيّر نهاية القصة.",
    status: "live",
    url: "timeline.html"
  },
  {
    name: "ميزان الثقة",
    desc: "حرّك السلايدر بين «أثق تمامًا» و«محتاج أتأكد» بناءً على مؤشرات بتظهر تدريجيًا.",
    status: "live",
    url: "trust-scale.html"
  },
  {
    name: "من أنا؟",
    desc: "تلميحات بتتكشف تدريجيًا عن أداة ذكاء اصطناعي أو إنتاجية، وعليك تحزر اسمها قبل ما تخلص التلميحات.",
    status: "live",
    url: "who-am-i.html"
  }
];

const grid = document.getElementById('gameGrid');
GAMES.forEach((g, i) => {
  const card = document.createElement('div');
  card.className = `card ${g.status}`;
  const statusLabel = g.status === 'live' ? 'جاهزة' : 'قريبًا';
  const ctaLabel = g.status === 'live' ? 'العب الآن ←' : 'قيد التنفيذ';

  card.innerHTML = `
    <div class="card-top">
      <span class="card-index">GAME_${String(i + 1).padStart(2, '0')}</span>
      <span class="status ${g.status}">${statusLabel}</span>
    </div>
    <div class="card-name">${g.name}</div>
    <div class="card-desc">${g.desc}</div>
    <div class="card-cta">${ctaLabel}</div>
  `;

  if (g.status === 'live') {
    card.addEventListener('click', () => { window.location.href = g.url; });
  }
  grid.appendChild(card);
});
</script>
</body>
</html>
