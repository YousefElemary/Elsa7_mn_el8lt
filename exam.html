<style>
  .exam-wrap{ max-width:640px; margin:0 auto; padding:50px 20px; }
  .exam-card{ background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:18px; padding:30px; }

  .exam-sub{ color:var(--text-muted); font-size:.9rem; margin-bottom:20px; }
  .exam-q{ margin-bottom:26px; }
  .exam-q-text{ font-weight:700; margin-bottom:12px; }
  .exam-opt{
    display:block; padding:12px 14px; margin-bottom:8px; border-radius:10px;
    border:1px solid var(--glass-border); background:rgba(255,255,255,.03);
    cursor:pointer; font-size:.9rem; transition:var(--transition-smooth);
  }
  .exam-opt:hover{ border-color:var(--accent-gold); }
  .exam-opt.selected{ border-color:var(--accent-gold); background:rgba(212,175,55,.12); }
  .exam-opt input{ margin-left:10px; }
  .exam-submit{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:var(--accent-gold); color:#0a0a0c; font-weight:800;
    font-family:var(--font-arabic); font-size:.95rem; cursor:pointer;
  }
  .exam-result{ text-align:center; }
  .exam-result .big{ font-size:2.4rem; font-weight:800; margin:14px 0; }
  .exam-result.pass .big{ color:#31d0aa; }
  .exam-result.fail .big{ color:#ff6b6b; }
  .exam-actions{ display:flex; gap:10px; margin-top:20px; justify-content:center; flex-wrap:wrap; }
  .exam-actions a, .exam-actions button{
    padding:10px 20px; border-radius:10px; text-decoration:none; font-family:var(--font-arabic);
    border:1px solid var(--glass-border); background:transparent; color:var(--text-main); cursor:pointer;
  }
  .module-list{ display:flex; flex-direction:column; gap:10px; }
  .module-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border-radius:12px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,.02); text-decoration:none; color:var(--text-main);
    transition:var(--transition-smooth);
  }
  .module-row:hover{ border-color:var(--accent-gold); }
  .module-name{ font-size:.92rem; font-weight:600; }
  .module-status{ font-size:.78rem; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .module-status.passed{ background:rgba(49,208,170,.15); color:#31d0aa; }
  .module-status.pending{ background:rgba(255,255,255,.06); color:var(--text-muted); }
  .provider-progress{ text-align:center; margin-bottom:22px; color:var(--text-muted); font-size:.9rem; }

const el = id => document.getElementById(id);
const params = new URLSearchParams(window.location.search);
const providerId = params.get('course');
const moduleId = params.get('module');
const provider = PROVIDERS[providerId];

let answers = {};

async function init() {
  const card = el('examCard');

  if (!provider) {
    card.innerHTML = `<div class="exam-sub">الكورس ده مش موجود.</div>`;
    return;
  }

  const user = await getCurrentUser();
  if (!user) {
    card.innerHTML = `
      <div class="exam-title">${provider.label}</div>
      <div class="exam-sub">لازم تسجل دخول الأول عشان تاخد الامتحانات وتكسب نقط.</div>
      <a href="login.html" class="exam-submit" style="display:block; text-align:center; text-decoration:none;">تسجيل الدخول</a>
    `;
    return;
  }

  if (moduleId && provider.modules[moduleId]) {
    renderExam(user);
  } else {
    renderHub(user);
  }
}

async function renderHub(user) {
  const card = el('examCard');
  const moduleIds = Object.keys(provider.modules);

  const { data: passedRows } = await supabaseClient
    .from('exam_attempts')
    .select('course_id')
    .eq('user_id', user.id)
    .eq('passed', true);

  const passedSet = new Set((passedRows || []).map(r => r.course_id));
  const passedCount = moduleIds.filter(id => passedSet.has(`${providerId}__${id}`)).length;

  card.innerHTML = `
    <div class="exam-title">${provider.label}</div>
    <div class="provider-progress">أنجزت ${passedCount} من ${moduleIds.length} امتحانات</div>
    <div class="module-list" id="moduleList"></div>
  `;

  const list = el('moduleList');
  moduleIds.forEach(id => {
    const mod = provider.modules[id];
    const passed = passedSet.has(`${providerId}__${id}`);
    const row = document.createElement('a');
    row.href = `exam.html?course=${providerId}&module=${id}`;
    row.className = 'module-row';
    row.innerHTML = `
      <span class="module-name">${mod.title}</span>
      <span class="module-status ${passed ? 'passed' : 'pending'}">${passed ? 'مكتمل ✓' : 'لسه'}</span>
    `;
    list.appendChild(row);
  });
}

function renderExam() {
  const mod = provider.modules[moduleId];
  const card = el('examCard');
  card.innerHTML = `
    <div class="exam-title">${mod.title}</div>
    <div class="exam-sub">لازم تجاوب صح على كل الأسئلة عشان تاخد نقطك (${POINTS_PER_MODULE} نقطة).</div>
    <div id="questionsWrap"></div>
    <button class="exam-submit" id="submitExamBtn">تسليم الامتحان</button>
  `;

  const wrap = el('questionsWrap');
  mod.questions.forEach((q, qi) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'exam-q';
    qDiv.innerHTML = `<div class="exam-q-text">${qi + 1}. ${q.q}</div>`;
    q.options.forEach((opt, oi) => {
      const optDiv = document.createElement('label');
      optDiv.className = 'exam-opt';
      optDiv.innerHTML = `<input type="radio" name="q${qi}" value="${oi}"> ${opt}`;
      optDiv.addEventListener('click', () => {
        answers[qi] = oi;
        qDiv.querySelectorAll('.exam-opt').forEach(o => o.classList.remove('selected'));
        optDiv.classList.add('selected');
      });
      qDiv.appendChild(optDiv);
    });
    wrap.appendChild(qDiv);
  });

  el('submitExamBtn').addEventListener('click', submitExam);
}

async function submitExam() {
  const mod = provider.modules[moduleId];
  const total = mod.questions.length;
  if (Object.keys(answers).length < total) {
    alert('جاوب على كل الأسئلة الأول');
    return;
  }

  let score = 0;
  mod.questions.forEach((q, qi) => {
    if (answers[qi] === q.correct) score++;
  });

  el('submitExamBtn').disabled = true;
  el('submitExamBtn').textContent = '...جاري التصحيح';

  const { data, error } = await supabaseClient.rpc('complete_course_exam', {
    p_course_id: `${providerId}__${moduleId}`,
    p_score: score,
    p_total: total,
    p_points: POINTS_PER_MODULE
  });

  const card = el('examCard');
  if (error) {
    card.innerHTML = `<div class="exam-sub">حصل خطأ: ${error.message}</div>`;
    return;
  }

  const passed = data.passed;
  card.innerHTML = `
    <div class="exam-result ${passed ? 'pass' : 'fail'}">
      <div class="exam-sub">${score} / ${total}</div>
      <div class="big">${passed ? 'ناجح ✅' : 'لسه محتاج مراجعة'}</div>
      <div class="exam-sub">
        ${passed
          ? (data.already_passed ? 'أنت عدّيت الامتحان ده قبل كده، مفيش نقط إضافية.' : `مبروك! أخدت ${POINTS_PER_MODULE} نقطة.`)
          : 'لازم تجاوب صح على كل الأسئلة عشان تعدي. جرّب تاني بعد ما تراجع المحتوى.'}
      </div>
      <div class="exam-actions">
        <a href="exam.html?course=${providerId}">باقي امتحانات ${provider.label}</a>
        <a href="courses.html">العودة للكورسات</a>
        ${!passed ? '<button onclick="location.reload()">إعادة المحاولة</button>' : ''}
      </div>
    </div>
  `;
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(console.error);
  });
}
</script>
<script src="pwa-install.js"></script>
</body>
</html>
