<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>if (!location.pathname.endsWith("login.html")) { document.documentElement.style.visibility = "hidden"; }</script>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c10">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غرفة التحقيق | الصح من الغلط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10; --panel:#12151b; --line:#242832;
    --ink:#eef1f6; --dim:#8b93a3;
    --signal:#31d0aa; --noise:#ff3b5c; --scan:#00d4ff; --warn:#ffb020;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; min-height:100vh; position:relative;}
  body::before{content:""; position:fixed; inset:0; background:repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px); pointer-events:none; z-index:1;}
  .app{position:relative; z-index:2; max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:28px 20px 40px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
  .back{font-family:monospace; font-size:12px; color:var(--dim); text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:20px;}
  .mark{font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;}
  .mark span{color:var(--scan);}

  .case-tag{font-family:monospace; font-size:11px; color:var(--warn); letter-spacing:2px; margin-bottom:10px; display:block;}
  .case-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:24px; line-height:1.5; margin-bottom:18px;}

  .scenario-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-bottom:22px; line-height:1.9; font-size:15px; color:var(--ink);
  }

  .clues{display:flex; flex-direction:column; gap:10px; margin-bottom:24px;}
  .clue{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden;
  }
  .clue-head{
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; font-family:'Cairo',sans-serif; font-weight:700; font-size:14.5px;
  }
  .clue-head:hover{background:var(--panel-hi, #161a22);}
  .clue-icon{font-family:monospace; color:var(--scan); font-size:13px;}
  .clue-body{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    font-size:13.5px; color:var(--dim); line-height:1.85;
  }
  .clue-body-inner{padding:0 16px 16px;}
  .clue.open .clue-body{max-height:200px;}
  .clue.open .clue-icon::before{content:"— ";}
  .clue-icon::before{content:"+ ";}

  .verdict-box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-bottom:16px;
  }
  .verdict-label{font-family:monospace; font-size:12px; color:var(--dim); letter-spacing:1px; margin-bottom:14px; display:block;}
  .verdict-btns{display:flex; gap:12px;}
  .vbtn{
    flex:1; padding:16px; border-radius:12px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-family:'Cairo',sans-serif; font-weight:800;
    font-size:15px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .vbtn.ok:hover{border-color:var(--signal); background:rgba(49,208,170,0.08);}
  .vbtn.bad:hover{border-color:var(--noise); background:rgba(255,59,92,0.08);}
  .vbtn[disabled]{opacity:.5; cursor:default;}
  .vbtn.chosen.correct{border-color:var(--signal); background:rgba(49,208,170,0.12);}
  .vbtn.chosen.incorrect{border-color:var(--noise); background:rgba(255,59,92,0.12);}

  .verdict-result{
    margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.85; display:none;
  }
  .verdict-result.show{display:block;}
  .verdict-result.correct{background:rgba(49,208,170,0.08); border:1px solid var(--signal); color:var(--signal);}
  .verdict-result.incorrect{background:rgba(255,59,92,0.08); border:1px solid var(--noise); color:var(--noise);}

  .nav-row{display:flex; gap:12px; margin-top:6px;}
  .btn{padding:14px; border-radius:12px; font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; cursor:pointer; border:none; flex:1;}
  .btn-primary{background:var(--scan); color:#04121a;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn[disabled]{opacity:.4; cursor:default;}

  .stage-intro{font-size:14px; color:var(--dim); line-height:1.9; margin-bottom:22px;}
  .stage-list{display:flex; flex-direction:column; gap:14px;}
  .stage-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px; cursor:pointer; transition:border-color .15s, transform .15s;
  }
  .stage-card:hover{border-color:var(--scan); transform:translateY(-2px);}
  .stage-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .stage-num{font-family:monospace; font-size:11px; color:var(--scan); letter-spacing:2px;}
  .stage-diff{font-family:monospace; font-size:11px; padding:3px 10px; border-radius:20px; border:1px solid var(--line);}
  .stage-diff.easy{color:var(--signal); border-color:var(--signal);}
  .stage-diff.mid{color:var(--warn); border-color:var(--warn);}
  .stage-diff.hard{color:var(--noise); border-color:var(--noise);}
  .stage-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:18px; margin-bottom:6px;}
  .stage-desc{font-size:13px; color:var(--dim); line-height:1.7; margin-bottom:10px;}
  .stage-meta{font-family:monospace; font-size:11px; color:var(--dim);}
  .stage-best{color:var(--signal);}

  .finish-box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:26px; text-align:center;
  }
  .finish-score{font-family:'Cairo',sans-serif; font-weight:800; font-size:34px; margin:10px 0; color:var(--scan);}
  .finish-label{font-family:monospace; font-size:12px; color:var(--dim); letter-spacing:1px;}
  .finish-note{font-size:14px; color:var(--dim); line-height:1.85; margin:16px 0 22px;}

  footer{margin-top:auto; padding-top:30px; text-align:center; color:var(--dim); font-size:12px; font-family:monospace;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div style="display:flex; gap:8px;">
      <a class="back" href="lobby.html">← اللوبي</a>
      <a class="back" href="index.html">🏠 الرئيسية</a>
    </div>
    <div class="mark">غرفة <span>التحقيق</span></div>
  </div>

  <!-- شاشة اختيار المرحلة -->
  <div id="stagePicker">
    <p class="stage-intro">اختار مرحلة وابدأ تحقق في القضايا. كل مرحلة أصعب من اللي قبلها.</p>
    <div class="stage-list" id="stageList"></div>
  </div>

  <!-- شاشة القضية -->
  <div id="caseView" style="display:none;">
    <span class="case-tag" id="caseNum">CASE_01</span>
    <h1 class="case-title" id="caseTitle"></h1>

    <div class="scenario-card" id="scenarioText"></div>

    <div class="clues" id="cluesList"></div>

    <div class="verdict-box">
      <span class="verdict-label">حكمك: الاستخدام ده صح ولا غلط؟</span>
      <div class="verdict-btns">
        <button class="vbtn ok" id="btnRight">صح ✓</button>
        <button class="vbtn bad" id="btnWrong">غلط ✕</button>
      </div>
      <div class="verdict-result" id="verdictResult"></div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="prevBtn">القضية السابقة</button>
      <button class="btn btn-primary" id="nextBtn" disabled>القضية التالية</button>
    </div>
  </div>

  <!-- شاشة النهاية -->
  <div id="finishView" style="display:none;">
    <div class="finish-box">
      <span class="finish-label" id="finishStageLabel">المرحلة اتخلصت</span>
      <div class="finish-score" id="finishScore"></div>
      <p class="finish-note" id="finishNote"></p>
      <div class="nav-row">
        <button class="btn btn-ghost" id="backToStagesBtn">قائمة المراحل</button>
        <button class="btn btn-primary" id="nextStageBtn">المرحلة الجاية</button>
      </div>
    </div>
  </div>

  <footer>غرفة التحقيق — الصح من الغلط</footer>
</div>

<script>
/* =====================================================================
   القضايا — عدّل هنا بس
   كل قضية: عنوان، نص السيناريو، مصفوفة أدلة (عنوان + تفاصيل)،
   verdict الصح (true = "صح"، false = "غلط")، وشرح بعد الحكم.

   المراحل — STAGES: كل مرحلة ليها key, name, diff (easy/mid/hard),
   desc, pointsPerCorrect, وcases (نفس بنية القضية القديمة).

const STAGE_ORDER = ['stage1', 'stage2', 'stage3'];

/* ===================================================================== */

let currentStageKey = null;
let idx = 0;
let answered = false;
let correctCount = 0;
const el = id => document.getElementById(id);

function renderStagePicker(){
  el('stagePicker').style.display = 'block';
  el('caseView').style.display = 'none';
  el('finishView').style.display = 'none';

  const list = el('stageList');
  list.innerHTML = '';
  STAGE_ORDER.forEach((key, i) => {
    const stage = STAGES[key];
    const card = document.createElement('div');
    card.className = 'stage-card';
    card.innerHTML = `
      <div class="stage-card-top">
        <span class="stage-num">STAGE_${String(i + 1).padStart(2,'0')}</span>
        <span class="stage-diff ${stage.diff}">${stage.diffLabel}</span>
      </div>
      <div class="stage-title">${stage.name}</div>
      <div class="stage-desc">${stage.desc}</div>
      <div class="stage-meta">${stage.cases.length} قضايا · ${stage.pointsPerCorrect} نقاط لكل إجابة صح</div>
    `;
    card.addEventListener('click', () => startStage(key));
    list.appendChild(card);
  });
}

function startStage(key){
  currentStageKey = key;
  idx = 0;
  correctCount = 0;
  el('stagePicker').style.display = 'none';
  el('finishView').style.display = 'none';
  el('caseView').style.display = 'block';
  render();
}

function render(){
  answered = false;
  const cases = STAGES[currentStageKey].cases;
  const c = cases[idx];
  el('caseNum').textContent = `CASE_${String(idx + 1).padStart(2,'0')} / ${cases.length}`;
  el('caseTitle').textContent = c.title;
  el('scenarioText').textContent = c.scenario;

  const cluesWrap = el('cluesList');
  cluesWrap.innerHTML = '';
  c.clues.forEach((clue, i) => {
    const div = document.createElement('div');
    div.className = 'clue';
    div.innerHTML = `
      <div class="clue-head">
        <span>${clue.title}</span>
        <span class="clue-icon"></span>
      </div>
      <div class="clue-body"><div class="clue-body-inner">${clue.body}</div></div>
    `;
    div.querySelector('.clue-head').addEventListener('click', () => {
      div.classList.toggle('open');
    });
    cluesWrap.appendChild(div);
  });

  ['btnRight','btnWrong'].forEach(id => {
    const b = el(id);
    b.disabled = false;
    b.classList.remove('chosen','correct','incorrect');
  });
  const vr = el('verdictResult');
  vr.className = 'verdict-result';
  vr.textContent = '';

  el('nextBtn').disabled = true;
  el('prevBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
}

function judge(choice){
  if(answered) return;
  answered = true;
  const cases = STAGES[currentStageKey].cases;
  const c = cases[idx];
  const isCorrect = choice === c.verdict;

  const chosenBtn = choice ? el('btnRight') : el('btnWrong');
  chosenBtn.classList.add('chosen', isCorrect ? 'correct' : 'incorrect');
  el('btnRight').disabled = true;
  el('btnWrong').disabled = true;

  const vr = el('verdictResult');
  vr.classList.add('show', isCorrect ? 'correct' : 'incorrect');
  vr.textContent = (isCorrect ? 'حكم صح. ' : 'حكم غلط. ') + c.explain;

  if (isCorrect) correctCount++;
  el('nextBtn').disabled = false;
}

el('btnRight').addEventListener('click', () => judge(true));
el('btnWrong').addEventListener('click', () => judge(false));

el('nextBtn').addEventListener('click', async () => {
  const cases = STAGES[currentStageKey].cases;
  if(idx < cases.length - 1){ idx++; render(); }
  else {
    const stage = STAGES[currentStageKey];
    const earned = correctCount * stage.pointsPerCorrect;
    if (typeof awardGamePoints === 'function') {
      await awardGamePoints('investigation-room', earned);
    }
    showFinish(stage, earned);
  }
});
el('prevBtn').addEventListener('click', () => {
  if(idx > 0){ idx--; render(); }
});

function showFinish(stage, earned){
  el('caseView').style.display = 'none';
  el('finishView').style.display = 'block';
  el('finishStageLabel').textContent = `خلصت ${stage.name}`;
  el('finishScore').textContent = `${correctCount} / ${stage.cases.length}`;
  el('finishNote').textContent = `كسبت ${earned} نقطة. راجع القضايا اللي غلطت فيها في دماغك قبل ما تكمل.`;

  const currentIndex = STAGE_ORDER.indexOf(currentStageKey);
  const hasNext = currentIndex < STAGE_ORDER.length - 1;
  const nextBtn = el('nextStageBtn');
  if (hasNext){
    nextBtn.style.display = 'block';
    nextBtn.textContent = 'المرحلة الجاية';
    nextBtn.onclick = () => startStage(STAGE_ORDER[currentIndex + 1]);
  } else {
    nextBtn.style.display = 'block';
    nextBtn.textContent = 'ارجع اللوبي';
    nextBtn.onclick = () => { window.location.href = 'lobby.html'; };
  }
}

el('backToStagesBtn').addEventListener('click', renderStagePicker);

renderStagePicker();
</script>

  });
